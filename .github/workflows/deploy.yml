# Checks, builds and deploys AnyAirDrop.com on every push to main.
#  - Pages: built with Astro, uploaded to the cPanel host over FTPS (only changed files).
#  - Signaling worker: deployed to Cloudflare, but only when its code changes, because a
#    deploy restarts the worker and briefly disconnects everyone's device list.
#
# Repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD,
#                     CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Also deploy the signaling worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check the site
        run: npx astro check

      - name: Type-check the signaling worker
        run: npx tsc -p signaling/tsconfig.json

      - name: Build the site
        run: npm run build

      - name: Test the signaling worker locally
        run: |
          npx wrangler dev --config signaling/wrangler.jsonc --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/ws/ice/ > /dev/null && break
            sleep 1
          done
          npm run test:signal || { cat wrangler.log; exit 1; }

      - name: Did the signaling worker change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "worker=${{ inputs.deploy_worker }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt 2>/dev/null; then
            if grep -qE '^signaling/' changed.txt; then echo "worker=true"; else echo "worker=false"; fi >> "$GITHUB_OUTPUT"
          else
            # First push or rewritten history: no reliable diff, so deploy to be safe.
            echo "worker=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy-site:
    name: Upload pages to cPanel
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anyairdrop.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # The host's certificate is issued for its own hostname, not the bare IP.
          # Set FTP_SERVER to that hostname and change this to "strict" to also verify it.
          security: loose
          local-dir: ./dist/
          # The FTP account is locked to /home/wiserw/anyairdrop.com, so its root is the site.
          server-dir: ./

      - name: Check the live homepage
        run: |
          for i in $(seq 1 10); do
            if curl -sf https://anyairdrop.com/ | grep -q '<title>'; then echo "Homepage is up"; exit 0; fi
            sleep 3
          done
          echo "Homepage did not respond with the site" && exit 1

  deploy-worker:
    name: Deploy signaling worker
    needs: check
    if: needs.check.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config signaling/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Test the live worker
        run: |
          node signaling/test/rooms.test.mjs wss://anyairdrop.com/ws
          node signaling/test/ice.test.mjs https://anyairdrop.com/ws/ice/
