name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: Also deploy the signaling worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-24.04
    outputs:
      worker: ${{ steps.changes.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check the site
        run: npx astro check

      - name: Type-check the signaling worker
        run: npx tsc -p signaling/tsconfig.json

      - name: Build the site
        run: npm run build

      - name: Test the signaling worker locally
        run: |
          npx wrangler dev --config signaling/wrangler.jsonc --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/ws/ice/ > /dev/null && break
            sleep 1
          done
          npm run test:signal || { cat wrangler.log; exit 1; }

      - name: Did the signaling worker change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "worker=${{ inputs.deploy_worker }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt 2>/dev/null; then
            if grep -qE '^signaling/' changed.txt; then echo "worker=true"; else echo "worker=false"; fi >> "$GITHUB_OUTPUT"
          else
            echo "worker=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy-site:
    name: Upload pages to cPanel
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://anyairdrop.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Test the FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$LFTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Empty or missing repository secrets:$missing"
            exit 1
          fi
          if ! lftp -u "$FTP_USERNAME,$LFTP_PASSWORD" "ftp://$FTP_SERVER" > ftp-test.log 2>&1 <<'EOF'
          set ssl:priority "NORMAL:-VERS-TLS1.3"
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          debug 3
          pwd
          cls -l
          bye
          EOF
          then
            tail -n 30 ftp-test.log | grep -viE 'PASS ' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > ftp-test.annot
            echo "::error title=FTP connection test failed::$(cat ftp-test.annot)"
            exit 1
          fi
          grep -viE 'PASS ' ftp-test.log | tail -n 20

      - name: Upload the site over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$LFTP_PASSWORD" "ftp://$FTP_SERVER" <<'EOF'
          set ssl:priority "NORMAL:-VERS-TLS1.3"
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-protect-list true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose --parallel=2 --exclude-glob .well-known --exclude-glob cgi-bin --exclude-glob .ftpquota ./dist/ ./
          bye
          EOF

      - name: Check the live homepage
        run: |
          for i in $(seq 1 10); do
            if curl -sf https://anyairdrop.com/ | grep -q '<title>'; then echo "Homepage is up"; exit 0; fi
            sleep 3
          done
          echo "Homepage did not respond with the site" && exit 1

  deploy-worker:
    name: Deploy signaling worker
    needs: check
    if: needs.check.outputs.worker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty or missing"
            exit 1
          fi
          if ! npx wrangler deploy --config signaling/wrangler.jsonc > wrangler-deploy.log 2>&1; then
            tail -n 25 wrangler-deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > wrangler-deploy.annot
            echo "::error title=Worker deploy failed::$(cat wrangler-deploy.annot)"
            exit 1
          fi
          tail -n 8 wrangler-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Test the live worker
        run: |
          node signaling/test/rooms.test.mjs wss://anyairdrop.com/ws
          node signaling/test/ice.test.mjs https://anyairdrop.com/ws/ice/
