<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How Wi-Fi connects a phone to the internet</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Phone -->
  <rect x="60" y="130" width="80" height="150" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <circle cx="100" cy="262" r="5" fill="none" stroke="#0F172A" stroke-width="2"/>
  <rect x="76" y="150" width="48" height="88" rx="4" fill="#E2E8F0"/>
  <text x="100" y="320" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Your phone</text>
  <text x="100" y="342" text-anchor="middle" font-size="14" fill="#475569">turns data into</text>
  <text x="100" y="360" text-anchor="middle" font-size="14" fill="#475569">radio signals</text>

  <!-- Radio waves -->
  <g fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round">
    <path d="M168 190 Q180 205 168 220"/>
    <path d="M188 176 Q208 205 188 234"/>
    <path d="M208 162 Q236 205 208 248"/>
  </g>
  <line x1="236" y1="205" x2="316" y2="205" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <text x="282" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">Radio waves</text>
  <text x="282" y="170" text-anchor="middle" font-size="13" fill="#475569">2.4, 5 or 6 GHz</text>

  <!-- Router -->
  <rect x="316" y="210" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <circle cx="340" cy="235" r="4" fill="#15803D"/>
  <circle cx="358" cy="235" r="4" fill="#15803D"/>
  <line x1="392" y1="210" x2="392" y2="140" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <line x1="420" y1="210" x2="436" y2="150" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round">
    <path d="M374 122 Q392 106 410 122"/>
    <path d="M360 108 Q392 80 424 108"/>
  </g>
  <text x="381" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Router</text>
  <text x="381" y="322" text-anchor="middle" font-size="14" fill="#475569">access point: shares the</text>
  <text x="381" y="340" text-anchor="middle" font-size="14" fill="#475569">channel, bridges to cable</text>

  <!-- Cable -->
  <line x1="446" y1="235" x2="540" y2="235" stroke="#0F172A" stroke-width="4"/>
  <text x="493" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Cable</text>
  <text x="493" y="262" text-anchor="middle" font-size="13" fill="#475569">Ethernet</text>

  <!-- Modem -->
  <rect x="540" y="210" width="90" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <circle cx="562" cy="235" r="4" fill="#15803D"/>
  <circle cx="578" cy="235" r="4" fill="#15803D"/>
  <text x="585" y="300" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Modem</text>
  <text x="585" y="322" text-anchor="middle" font-size="14" fill="#475569">speaks to your</text>
  <text x="585" y="340" text-anchor="middle" font-size="14" fill="#475569">internet provider</text>

  <!-- Internet -->
  <line x1="630" y1="235" x2="668" y2="235" stroke="#0F172A" stroke-width="4"/>
  <path d="M690 262 h56 a22 22 0 0 0 2 -44 a30 30 0 0 0 -56 -8 a24 24 0 0 0 -2 52 z" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" transform="translate(0 0)"/>
  <text x="718" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Internet</text>
</svg>
