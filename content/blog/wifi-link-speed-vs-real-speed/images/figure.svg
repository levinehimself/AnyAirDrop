<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>Where the time goes in one 865 microsecond Wi-Fi burst, and why 1,201 Mbps becomes about 888 Mbps</title>
  <defs>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="800" cy="470" r="80"/><circle cx="800" cy="470" r="140"/><circle cx="800" cy="470" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">HOW WI-FI WORKS · STEP BY STEP</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Where the time goes in one 865 µs burst</text>

  <!-- timeline card -->
  <rect x="32" y="108" width="736" height="214" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="56" y="129" font-size="13" font-weight="700" fill="#475569">Step, in order</text>
  <text x="276" y="129" font-size="13" fill="#475569">0 µs</text>
  <rect x="470" y="119" width="10" height="10" rx="3" fill="#475569"/>
  <text x="486" y="129" font-size="13" fill="#475569">Overhead</text>
  <rect x="568" y="119" width="10" height="10" rx="3" fill="#2563EB"/>
  <text x="584" y="129" font-size="13" fill="#475569">Data</text>
  <text x="752" y="129" font-size="13" font-weight="700" text-anchor="end" fill="#475569">865 µs</text>
  <line x1="40" y1="139" x2="760" y2="139" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- row bands -->
  <rect x="40" y="142.5" width="720" height="27" rx="8" fill="#F8FAFC"/>
  <rect x="40" y="200.5" width="720" height="27" rx="8" fill="#F8FAFC"/>
  <rect x="40" y="258.5" width="720" height="27" rx="8" fill="#F8FAFC"/>
  <line x1="276" y1="144" x2="276" y2="314" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="752" y1="144" x2="752" y2="314" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- 1 wait for idle channel -->
  <circle cx="56" cy="156" r="10.5" fill="#DBEAFE"/>
  <text x="56" y="160.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
  <text x="76" y="161" font-size="15" font-weight="700" fill="#0F172A">Wait for idle channel</text>
  <rect x="276" y="148" width="23.7" height="16" rx="3" fill="#475569"/>
  <text x="308" y="161" font-size="14" font-weight="700" fill="#475569">43 µs</text>

  <!-- 2 random backoff -->
  <circle cx="56" cy="185" r="10.5" fill="#DBEAFE"/>
  <text x="56" y="189.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
  <text x="76" y="190" font-size="15" font-weight="700" fill="#0F172A">Random backoff</text>
  <rect x="299.7" y="177" width="37.1" height="16" rx="3" fill="#475569"/>
  <text x="345" y="190" font-size="14" font-weight="700" fill="#475569">67.5 µs</text>

  <!-- 3 preamble and headers -->
  <circle cx="56" cy="214" r="10.5" fill="#DBEAFE"/>
  <text x="56" y="218.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
  <text x="76" y="219" font-size="15" font-weight="700" fill="#0F172A">Preamble and headers</text>
  <rect x="336.8" y="206" width="27.5" height="16" rx="3" fill="#475569"/>
  <text x="373" y="219" font-size="14" font-weight="700" fill="#475569">about 50 µs</text>

  <!-- 4 data -->
  <circle cx="56" cy="243" r="10.5" fill="#DBEAFE"/>
  <text x="56" y="247.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
  <text x="76" y="248" font-size="15" font-weight="700" fill="#0F172A">Data: 64 packets</text>
  <rect x="364.3" y="235" width="361.3" height="16" rx="3" fill="#2563EB"/>
  <text x="545" y="248" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">656.5 µs</text>

  <!-- 5 short gap -->
  <circle cx="56" cy="272" r="10.5" fill="#DBEAFE"/>
  <text x="56" y="276.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">5</text>
  <text x="76" y="277" font-size="15" font-weight="700" fill="#0F172A">Short gap (SIFS)</text>
  <rect x="725.6" y="264" width="8.8" height="16" rx="3" fill="#475569"/>
  <text x="717" y="277" font-size="14" font-weight="700" text-anchor="end" fill="#475569">16 µs</text>

  <!-- 6 block acknowledgement -->
  <circle cx="56" cy="301" r="10.5" fill="#DBEAFE"/>
  <text x="56" y="305.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">6</text>
  <text x="76" y="306" font-size="15" font-weight="700" fill="#0F172A">Block acknowledgement</text>
  <rect x="734.4" y="293" width="17.6" height="16" rx="3" fill="#475569"/>
  <text x="726" y="306" font-size="14" font-weight="700" text-anchor="end" fill="#475569">about 32 µs</text>

  <!-- result strip -->
  <rect x="32" y="334" width="736" height="50" rx="14" fill="#0F172A"/>
  <text x="56" y="368" font-size="30" font-weight="700" fill="#FFFFFF">74%</text>
  <line x1="136" y1="344" x2="136" y2="374" stroke="#475569" stroke-width="1.5"/>
  <text x="156" y="357" font-size="16" font-weight="700" fill="#FFFFFF">of the 1,201 Mbps link rate carries your data</text>
  <text x="156" y="375" font-size="14" fill="#DBEAFE">768,000 bits in 865 µs, about 888 Mbps. Best case: one device, perfect signal.</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Arithmetic on paper, not a measurement</text>
</svg>
