<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How the link between router and helper box limits speed</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">Three ways to reach a far room</text>

  <!-- Row 1 -->
  <text x="30" y="78" font-size="15" font-weight="700" fill="#0F172A">Single-radio extender</text>
  <rect x="30" y="88" width="90" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="75" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Router</text>
  <line x1="120" y1="113" x2="240" y2="113" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="180" y="104" text-anchor="middle" font-size="13" fill="#475569">Same channel</text>
  <rect x="240" y="88" width="110" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="295" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Extender</text>
  <text x="295" y="128" text-anchor="middle" font-size="13" fill="#475569">one radio</text>
  <line x1="350" y1="113" x2="470" y2="113" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="410" y="104" text-anchor="middle" font-size="13" fill="#475569">Same channel</text>
  <rect x="470" y="88" width="90" height="50" rx="10" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
  <text x="515" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone</text>
  <text x="590" y="108" font-size="15" font-weight="700" fill="#2563EB">Both hops share one</text>
  <text x="590" y="127" font-size="14" fill="#475569">channel: roughly half</text>

  <!-- Row 2 -->
  <text x="30" y="178" font-size="15" font-weight="700" fill="#0F172A">Mesh with a dedicated backhaul radio</text>
  <rect x="30" y="188" width="90" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="75" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Router</text>
  <line x1="120" y1="213" x2="240" y2="213" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="180" y="204" text-anchor="middle" font-size="13" fill="#475569">Own radio</text>
  <rect x="240" y="188" width="110" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="295" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Mesh node</text>
  <text x="295" y="228" text-anchor="middle" font-size="13" fill="#475569">extra radio</text>
  <line x1="350" y1="213" x2="470" y2="213" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="410" y="204" text-anchor="middle" font-size="13" fill="#475569">Client radio</text>
  <rect x="470" y="188" width="90" height="50" rx="10" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
  <text x="515" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone</text>
  <text x="590" y="208" font-size="15" font-weight="700" fill="#15803D">Own radio for backhaul</text>
  <text x="590" y="227" font-size="14" fill="#475569">no sharing with clients</text>

  <!-- Row 3 -->
  <text x="30" y="278" font-size="15" font-weight="700" fill="#0F172A">Wired backhaul (mesh node or access point)</text>
  <rect x="30" y="288" width="90" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="75" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Router</text>
  <line x1="120" y1="313" x2="240" y2="313" stroke="#0F172A" stroke-width="4"/>
  <text x="180" y="304" text-anchor="middle" font-size="13" fill="#475569">Ethernet</text>
  <rect x="240" y="288" width="110" height="50" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="295" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Mesh node</text>
  <text x="295" y="328" text-anchor="middle" font-size="13" fill="#475569">cabled in</text>
  <line x1="350" y1="313" x2="470" y2="313" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="410" y="304" text-anchor="middle" font-size="13" fill="#475569">Wi-Fi</text>
  <rect x="470" y="288" width="90" height="50" rx="10" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
  <text x="515" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone</text>
  <text x="590" y="308" font-size="15" font-weight="700" fill="#15803D">Cable backhaul: Wi-Fi</text>
  <text x="590" y="327" font-size="14" fill="#475569">airtime on last hop only</text>

  <text x="30" y="376" font-size="14" fill="#475569">On-paper limits. Real results depend on signal, walls and interference.</text>
</svg>
