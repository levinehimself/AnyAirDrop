<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>Each hop on one channel divides the speed</title>
  <defs>
    <symbol id="i-check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M15 25l7 7 12-14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">ROUTERS AND NETWORKS · BY THE NUMBERS</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Each hop on one channel divides the speed</text>

  <!-- Left panel: bars -->
  <rect x="32" y="108" width="392" height="276" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="48" y="138" font-size="17" font-weight="700" fill="#0F172A">Single-radio extenders, one channel</text>

  <text x="48" y="176" font-size="15" font-weight="700" fill="#0F172A">No extender: whole channel</text>
  <text x="408" y="176" font-size="17" font-weight="700" text-anchor="end" fill="#0F172A">600 Mbps</text>
  <rect x="48" y="185" width="360" height="22" rx="11" fill="#E2E8F0"/>
  <rect x="48" y="185" width="360" height="22" rx="11" fill="#2563EB"/>
  <text x="62" y="201" font-size="14" font-weight="700" fill="#FFFFFF">1 wireless hop</text>

  <text x="48" y="238" font-size="15" font-weight="700" fill="#0F172A">One extender</text>
  <text x="408" y="238" font-size="17" font-weight="700" text-anchor="end" fill="#0F172A">300 Mbps</text>
  <rect x="48" y="247" width="360" height="22" rx="11" fill="#E2E8F0"/>
  <rect x="48" y="247" width="180" height="22" rx="11" fill="#2563EB"/>
  <text x="240" y="263" font-size="14" fill="#475569">2 hops: half</text>

  <text x="48" y="300" font-size="15" font-weight="700" fill="#0F172A">Two extenders</text>
  <text x="408" y="300" font-size="17" font-weight="700" text-anchor="end" fill="#0F172A">200 Mbps</text>
  <rect x="48" y="309" width="360" height="22" rx="11" fill="#E2E8F0"/>
  <rect x="48" y="309" width="120" height="22" rx="11" fill="#2563EB"/>
  <text x="180" y="325" font-size="14" fill="#475569">3 hops: a third</text>

  <text x="48" y="362" font-size="14" fill="#475569">Best cases. Real results are lower.</text>

  <!-- Right panel: phone to phone -->
  <rect x="448" y="108" width="320" height="276" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="464" y="138" font-size="17" font-weight="700" fill="#0F172A">Moving a file between phones</text>

  <text x="464" y="190" font-size="34" font-weight="700" fill="#2563EB">1/2</text>
  <text x="464" y="208" font-size="13" fill="#475569">link rate</text>
  <text x="540" y="172" font-size="15" font-weight="700" fill="#0F172A">Same node</text>
  <text x="540" y="191" font-size="14" fill="#475569">Phone to node to phone:</text>
  <text x="540" y="210" font-size="14" fill="#475569">two transmissions.</text>

  <line x1="464" y1="228" x2="752" y2="228" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="464" y="271" font-size="34" font-weight="700" fill="#2563EB">1/3</text>
  <text x="464" y="289" font-size="13" fill="#475569">link rate</text>
  <text x="540" y="253" font-size="15" font-weight="700" fill="#0F172A">Different nodes</text>
  <text x="540" y="272" font-size="14" fill="#475569">Shared wireless backhaul:</text>
  <text x="540" y="291" font-size="14" fill="#475569">three transmissions.</text>

  <rect x="464" y="308" width="288" height="60" rx="12" fill="#DCFCE7"/>
  <use href="#i-check" x="476" y="326" width="24" height="24" color="#15803D"/>
  <text x="512" y="334" font-size="14" font-weight="700" fill="#0F172A">Dedicated or wired backhaul</text>
  <text x="512" y="353" font-size="14" fill="#475569">lets the hops partly overlap.</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">On paper, not measured</text>
</svg>
