<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How two browsers connect for a direct file transfer</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="400" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Signaling introduces the peers, the file goes direct</text>

  <!-- Signaling server -->
  <rect x="280" y="70" width="240" height="70" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="400" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Signaling server</text>
  <text x="400" y="124" text-anchor="middle" font-size="14" fill="#475569">relays setup messages only</text>

  <!-- Setup messages -->
  <line x1="155" y1="250" x2="280" y2="125" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <line x1="645" y1="250" x2="520" y2="125" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <text x="215" y="165" text-anchor="end" font-size="14" fill="#475569">offer and</text>
  <text x="215" y="183" text-anchor="end" font-size="14" fill="#475569">ICE candidates</text>
  <text x="585" y="165" text-anchor="start" font-size="14" fill="#475569">answer and</text>
  <text x="585" y="183" text-anchor="start" font-size="14" fill="#475569">ICE candidates</text>

  <!-- Browser A -->
  <rect x="60" y="250" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="155" y="284" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Sender</text>
  <text x="155" y="308" text-anchor="middle" font-size="14" fill="#475569">reads file in chunks</text>

  <!-- Browser B -->
  <rect x="550" y="250" width="190" height="80" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="645" y="284" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Receiver</text>
  <text x="645" y="308" text-anchor="middle" font-size="14" fill="#475569">reassembles the file</text>

  <!-- Direct data channel -->
  <line x1="250" y1="292" x2="550" y2="292" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">Direct data channel</text>
  <text x="400" y="318" text-anchor="middle" font-size="14" fill="#475569">encrypted, one chunk at a time</text>

  <text x="400" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#15803D">The file never passes through the signaling server</text>
</svg>
