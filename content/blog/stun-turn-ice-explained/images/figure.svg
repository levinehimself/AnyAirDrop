<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>Phone and laptop on the same Wi-Fi connect over their local addresses, so the file stays off the internet</title>
  <defs>
  <symbol id="i-phone" viewBox="0 0 48 48"><rect x="14" y="4" width="20" height="40" rx="5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M21 9h6M21 39h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="21" rx="3" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M3 37h42l-3.5 4h-35z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-router" viewBox="0 0 48 48"><path d="M13 29L9 11M35 29l4-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="4" y="29" width="40" height="13" rx="3.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><circle cx="13" cy="35.5" r="1.8" fill="currentColor"/><circle cx="20" cy="35.5" r="1.8" fill="currentColor"/><path d="M31 35.5h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M14 37a9 9 0 0 1-1.5-17.9A11.5 11.5 0 0 1 34.6 17 8.5 8.5 0 0 1 35 37z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">TRANSFER IN PRACTICE · WHERE IT HAPPENS</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Same Wi-Fi: the file stays in the building</text>

  <!-- The Wi-Fi network -->
  <rect x="32" y="108" width="736" height="190" rx="16" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>

  <!-- Phone A -->
  <rect x="48" y="124" width="220" height="158" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="84" cy="154" r="20" fill="#DBEAFE"/>
  <use href="#i-phone" x="71" y="141" width="26" height="26" color="#2563EB"/>
  <text x="114" y="161" font-size="18" font-weight="700" fill="#0F172A">Phone A</text>
  <rect x="60" y="178" width="196" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="72" y="196" font-size="13" font-weight="700" fill="#2563EB">Host candidate</text>
  <text x="72" y="214" font-size="14" font-weight="700" fill="#0F172A">192.168.1.23:50000</text>
  <text x="72" y="246" font-size="13" font-weight="700" fill="#475569">Server-reflexive</text>
  <text x="72" y="264" font-size="14" fill="#475569">203.0.113.7:61000</text>

  <!-- Laptop B -->
  <rect x="532" y="124" width="220" height="158" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="568" cy="154" r="20" fill="#DBEAFE"/>
  <use href="#i-laptop" x="555" y="141" width="26" height="26" color="#2563EB"/>
  <text x="598" y="161" font-size="18" font-weight="700" fill="#0F172A">Laptop B</text>
  <rect x="544" y="178" width="196" height="46" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="556" y="196" font-size="13" font-weight="700" fill="#2563EB">Host candidate</text>
  <text x="556" y="214" font-size="14" font-weight="700" fill="#0F172A">192.168.1.42:50100</text>
  <text x="556" y="246" font-size="13" font-weight="700" fill="#475569">Server-reflexive</text>
  <text x="556" y="264" font-size="14" fill="#475569">203.0.113.7:61044</text>

  <!-- The file path -->
  <line x1="256" y1="201" x2="372" y2="201" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <line x1="428" y1="201" x2="544" y2="201" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="144" font-size="16" font-weight="700" text-anchor="middle" fill="#2563EB">Host pair wins</text>
  <text x="400" y="164" font-size="14" text-anchor="middle" fill="#475569">Tested first, file stays inside</text>
  <circle cx="400" cy="201" r="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <use href="#i-router" x="383" y="184" width="34" height="34" color="#2563EB"/>
  <text x="400" y="262" font-size="14" text-anchor="middle" fill="#475569">Router: public 203.0.113.7</text>

  <!-- Link to the internet that the file does not use -->
  <line x1="400" y1="276" x2="400" y2="318" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="32" y="318" width="736" height="58" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="68" cy="347" r="20" fill="#E2E8F0"/>
  <use href="#i-cloud" x="55" y="334" width="26" height="26" color="#475569"/>
  <text x="104" y="342" font-size="17" font-weight="700" fill="#0F172A">The internet</text>
  <text x="104" y="362" font-size="14" fill="#475569">STUN and signaling messages only. No file packet goes here.</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Made-up addresses, for illustration</text>
</svg>
