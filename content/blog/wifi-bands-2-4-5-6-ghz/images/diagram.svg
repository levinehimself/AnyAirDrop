<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Free-space path loss at 10 meters for 2.4, 5 and 6 GHz</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="30" y="38" font-size="20" font-weight="700" fill="#0F172A">Free-space path loss at 10 meters</text>
  <text x="30" y="60" font-size="14" fill="#475569">Same distance, same antennas: only the frequency changes. Longer bar means weaker signal.</text>

  <!-- Row 1: 2.4 GHz -->
  <text x="30" y="112" font-size="18" font-weight="700" fill="#0F172A">2.4 GHz</text>
  <text x="30" y="132" font-size="13" fill="#475569">12.5 cm wavelength</text>
  <rect x="190" y="100" width="360" height="30" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <text x="562" y="121" font-size="16" font-weight="700" fill="#0F172A">60.0 dB</text>

  <!-- Row 2: 5 GHz -->
  <text x="30" y="174" font-size="18" font-weight="700" fill="#0F172A">5 GHz</text>
  <text x="30" y="194" font-size="13" fill="#475569">6 cm wavelength</text>
  <rect x="190" y="162" width="360" height="30" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="550" y="162" width="38" height="30" rx="4" fill="#2563EB"/>
  <text x="600" y="183" font-size="16" font-weight="700" fill="#0F172A">66.4 dB <tspan fill="#2563EB">(+6.4)</tspan></text>

  <!-- Row 3: 6 GHz -->
  <text x="30" y="236" font-size="18" font-weight="700" fill="#0F172A">6 GHz</text>
  <text x="30" y="256" font-size="13" fill="#475569">5 cm wavelength</text>
  <rect x="190" y="224" width="360" height="30" rx="4" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="550" y="224" width="48" height="30" rx="4" fill="#2563EB"/>
  <text x="610" y="245" font-size="16" font-weight="700" fill="#0F172A">68.0 dB <tspan fill="#2563EB">(+8.0)</tspan></text>

  <!-- Worked arithmetic -->
  <rect x="30" y="284" width="740" height="92" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="50" y="308" font-size="16" font-weight="700" fill="#0F172A">Extra loss = 20 × log10(f2 ÷ f1)</text>
  <text x="50" y="330" font-size="14" fill="#475569">5 GHz vs 2.4 GHz: 20 × log10(5 ÷ 2.4) = 20 × 0.319 = 6.4 dB, about 4.3 times less power</text>
  <text x="50" y="350" font-size="14" fill="#475569">6 GHz vs 2.4 GHz: 20 × log10(6 ÷ 2.4) = 20 × 0.398 = 8.0 dB, about 6.3 times less power</text>
  <text x="50" y="368" font-size="14" fill="#475569">Walls add more loss on top, and add more at higher frequencies.</text>
</svg>
