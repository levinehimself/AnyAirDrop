<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>Which Wi-Fi band to pick: 2.4, 5 or 6 GHz</title>
  <defs>
    <symbol id="i-wall" viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="30" rx="2" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M5 19h38M5 29h38M20 9v10M32 19v10M14 29v10M28 29v10" stroke="currentColor" stroke-width="2.5"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="21" rx="3" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M3 37h42l-3.5 4h-35z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-router" viewBox="0 0 48 48"><path d="M13 29L9 11M35 29l4-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="4" y="29" width="40" height="13" rx="3.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><circle cx="13" cy="35.5" r="1.8" fill="currentColor"/><circle cx="20" cy="35.5" r="1.8" fill="currentColor"/><path d="M31 35.5h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M15 25l7 7 12-14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-warning" viewBox="0 0 48 48"><path d="M24 6L44 40H4z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 18v11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="34.5" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="10" cy="460" r="80"/><circle cx="10" cy="460" r="140"/><circle cx="10" cy="460" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">HOW WI-FI WORKS · DECISION GUIDE</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Pick the band that fits where you are</text>

  <!-- Column headers -->
  <use href="#i-check" x="288" y="108" width="18" height="18" color="#15803D"/>
  <text x="312" y="122" font-size="13" font-weight="700" letter-spacing="1.2" fill="#15803D">BEST WHEN</text>
  <use href="#i-warning" x="534" y="108" width="18" height="18" color="#B45309"/>
  <text x="558" y="122" font-size="13" font-weight="700" letter-spacing="1.2" fill="#B45309">WATCH FOR</text>

  <!-- Row 1: 2.4 GHz -->
  <rect x="32" y="132" width="736" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="68" cy="171" r="24" fill="#DBEAFE"/>
  <use href="#i-wall" x="54" y="157" width="28" height="28" color="#2563EB"/>
  <text x="104" y="169" font-size="22" font-weight="700" fill="#0F172A">2.4 GHz</text>
  <text x="104" y="189" font-size="14" fill="#475569">Longest reach</text>
  <line x1="274" y1="146" x2="274" y2="196" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="288" y="157" font-size="14" fill="#475569">Far from the router, behind</text>
  <text x="288" y="176" font-size="14" fill="#475569">walls, or for an old gadget that</text>
  <text x="288" y="195" font-size="14" fill="#475569">only speaks 2.4 GHz</text>
  <line x1="520" y1="146" x2="520" y2="196" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="534" y="166" font-size="14" fill="#475569">Crowded by neighbors,</text>
  <text x="534" y="185" font-size="14" fill="#475569">microwave ovens and Bluetooth</text>

  <!-- Row 2: 5 GHz -->
  <rect x="32" y="218" width="736" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="68" cy="257" r="24" fill="#DBEAFE"/>
  <use href="#i-laptop" x="54" y="243" width="28" height="28" color="#2563EB"/>
  <text x="104" y="255" font-size="22" font-weight="700" fill="#0F172A">5 GHz</text>
  <text x="104" y="275" font-size="14" fill="#475569">More room, more speed</text>
  <line x1="274" y1="232" x2="274" y2="282" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="288" y="243" font-size="14" fill="#475569">Your signal is strong: wider</text>
  <text x="288" y="262" font-size="14" fill="#475569">channels and less interference</text>
  <text x="288" y="281" font-size="14" fill="#475569">make it usually faster</text>
  <line x1="520" y1="232" x2="520" y2="282" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="534" y="243" font-size="14" fill="#475569">Some channels must yield to</text>
  <text x="534" y="262" font-size="14" fill="#475569">radar (DFS), so a router may</text>
  <text x="534" y="281" font-size="14" fill="#475569">take a minute to start 5 GHz</text>

  <!-- Row 3: 6 GHz -->
  <rect x="32" y="304" width="736" height="78" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="68" cy="343" r="24" fill="#DBEAFE"/>
  <use href="#i-router" x="54" y="329" width="28" height="28" color="#2563EB"/>
  <text x="104" y="341" font-size="22" font-weight="700" fill="#0F172A">6 GHz</text>
  <text x="104" y="361" font-size="14" fill="#475569">Most room, cleanest air</text>
  <line x1="274" y1="318" x2="274" y2="368" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="288" y="329" font-size="14" fill="#475569">You sit close to the router</text>
  <text x="288" y="348" font-size="14" fill="#475569">and have a Wi-Fi 6E or</text>
  <text x="288" y="367" font-size="14" fill="#475569">Wi-Fi 7 device</text>
  <line x1="520" y1="318" x2="520" y2="368" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="534" y="329" font-size="14" fill="#475569">Shortest reach, and it needs</text>
  <text x="534" y="348" font-size="14" fill="#475569">WPA3. Older devices cannot</text>
  <text x="534" y="367" font-size="14" fill="#475569">see the network at all</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Rules of thumb, not measurements</text>
</svg>
