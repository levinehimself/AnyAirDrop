<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>The slowest link sets the pace</title>
  <defs>
    <symbol id="i-laptop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="21" rx="3" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M3 37h42l-3.5 4h-35z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-plug" viewBox="0 0 48 48"><rect x="11" y="6" width="26" height="22" rx="3.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M18 6v8M24 6v8M30 6v8M24 28v14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="i-usb" viewBox="0 0 48 48"><rect x="17" y="4" width="14" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M22 8.5v3M26 8.5v3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><rect x="12" y="16" width="24" height="28" rx="4.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="35" r="2.2" fill="currentColor"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">ROUTERS AND NETWORKS · WHERE IT HAPPENS</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">The slowest link sets the pace</text>

  <!-- The chain -->
  <path d="M173 130H364M358 124l6 6-6 6M436 130H627M621 124l6 6-6 6" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <circle cx="141" cy="130" r="22" fill="#DBEAFE"/>
  <use href="#i-laptop" x="127" y="116" width="28" height="28" color="#2563EB"/>
  <text x="141" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">Laptop SSD, read</text>
  <text x="141" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#0F172A">1,500 MB/s</text>

  <circle cx="400" cy="130" r="22" fill="#DBEAFE"/>
  <use href="#i-plug" x="386" y="116" width="28" height="28" color="#2563EB"/>
  <text x="400" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">Gigabit Ethernet</text>
  <text x="400" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#0F172A">117 MB/s</text>

  <circle cx="659" cy="130" r="22" fill="#FEF3C7"/>
  <use href="#i-usb" x="645" y="116" width="28" height="28" color="#B45309"/>
  <text x="659" y="176" font-size="15" font-weight="700" text-anchor="middle" fill="#0F172A">USB 2.0 stick, write</text>
  <text x="659" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#B45309">30 MB/s</text>
  <rect x="691" y="119" width="72" height="22" rx="11" fill="#FEF3C7"/>
  <text x="727" y="134.5" font-size="13" font-weight="700" text-anchor="middle" fill="#B45309">Slowest</text>

  <!-- Time panel -->
  <rect x="32" y="216" width="736" height="168" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="52" y="245" font-size="17" font-weight="700" fill="#0F172A">Copying a 10 GB video (10,000 MB)</text>

  <text x="52" y="279" font-size="15" font-weight="700" fill="#0F172A">To the USB 2.0 stick</text>
  <text x="52" y="297" font-size="14" fill="#475569">A faster network would not help</text>
  <rect x="304" y="272" width="270" height="24" rx="12" fill="#B45309"/>
  <text x="586" y="289" font-size="15" font-weight="700" fill="#0F172A">5.6 minutes <tspan font-size="14" font-weight="400" fill="#475569">(333 s)</tspan></text>

  <text x="52" y="339" font-size="15" font-weight="700" fill="#0F172A">To an internal SSD</text>
  <text x="52" y="357" font-size="14" fill="#475569">The cable is the limit</text>
  <rect x="304" y="332" width="68.9" height="24" rx="12" fill="#15803D"/>
  <text x="385" y="349" font-size="15" font-weight="700" fill="#0F172A">1.4 minutes <tspan font-size="14" font-weight="400" fill="#475569">(85 s)</tspan></text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Assumed speeds, not measurements</text>
</svg>
