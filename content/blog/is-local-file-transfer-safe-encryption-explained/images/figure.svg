<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>How the habits for safe local transfer differ between home Wi-Fi and shared Wi-Fi</title>
  <defs>
  <symbol id="i-router" viewBox="0 0 48 48"><path d="M13 29L9 11M35 29l4-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="4" y="29" width="40" height="13" rx="3.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><circle cx="13" cy="35.5" r="1.8" fill="currentColor"/><circle cx="20" cy="35.5" r="1.8" fill="currentColor"/><path d="M31 35.5h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="i-people" viewBox="0 0 48 48"><circle cx="17" cy="16" r="7" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M4 41c0-8 6-13 13-13s13 5 13 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="34" cy="18" r="5.5" stroke="currentColor" stroke-width="2.5" fill="none"/><path d="M36 28c5 1 8 5 8 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">TRANSFER IN PRACTICE · COMPARED</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Shared Wi-Fi needs more care than home Wi-Fi</text>

  <g>
    <rect x="32" y="108" width="360" height="268" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="72" cy="146" r="22" fill="#DBEAFE"/>
    <use href="#i-router" x="58" y="132" width="28" height="28" color="#2563EB"/>
    <text x="108" y="142" font-size="19" font-weight="700" fill="#0F172A">Home Wi-Fi</text>
    <text x="108" y="164" font-size="14" fill="#475569">Your own router and devices</text>
    <rect x="293" y="124" width="83" height="26" rx="13" fill="#DCFCE7"/>
    <text x="334.5" y="142" font-size="13" font-weight="700" text-anchor="middle" fill="#15803D">Low risk</text>
    <circle cx="56" cy="197" r="3.5" fill="#2563EB"/>
    <text x="70" y="202" font-size="14" fill="#475569">Only you and your household are on</text>
    <text x="70" y="223" font-size="14" fill="#475569">the network.</text>
    <circle cx="56" cy="253" r="3.5" fill="#2563EB"/>
    <text x="70" y="258" font-size="14" fill="#475569">The transfer is encrypted, and you are</text>
    <text x="70" y="279" font-size="14" fill="#475569">sitting next to both devices.</text>
    <circle cx="56" cy="309" r="3.5" fill="#2563EB"/>
    <text x="70" y="314" font-size="14" fill="#475569">One habit: check that the name on the</text>
    <text x="70" y="335" font-size="14" fill="#475569">receiving screen is your own device</text>
    <text x="70" y="356" font-size="14" fill="#475569">before you tap Accept.</text>
  </g>
  <g>
    <rect x="408" y="108" width="360" height="268" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="448" cy="146" r="22" fill="#DBEAFE"/>
    <use href="#i-people" x="434" y="132" width="28" height="28" color="#2563EB"/>
    <text x="484" y="142" font-size="19" font-weight="700" fill="#0F172A">Shared Wi-Fi</text>
    <text x="484" y="164" font-size="14" fill="#475569">Offices, cafes, hotels, apartments</text>
    <rect x="661" y="124" width="91" height="26" rx="13" fill="#FEF3C7"/>
    <text x="706.5" y="142" font-size="13" font-weight="700" text-anchor="middle" fill="#B45309">More care</text>
    <circle cx="432" cy="197" r="3.5" fill="#2563EB"/>
    <text x="446" y="202" font-size="14" fill="#475569">You share the network with others, so</text>
    <text x="446" y="223" font-size="14" fill="#475569">keep your receive visibility narrow.</text>
    <circle cx="432" cy="253" r="3.5" fill="#2563EB"/>
    <text x="446" y="258" font-size="14" fill="#475569">Prefer end-to-end encryption, and use</text>
    <text x="446" y="279" font-size="14" fill="#475569">the pairing code or QR step, if any.</text>
    <circle cx="432" cy="309" r="3.5" fill="#2563EB"/>
    <text x="446" y="314" font-size="14" fill="#475569">If the network blocks device-to-device</text>
    <text x="446" y="335" font-size="14" fill="#475569">traffic, that is deliberate. A personal</text>
    <text x="446" y="356" font-size="14" fill="#475569">hotspot is safer than weakening it.</text>
  </g>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Habits, not guarantees</text>
</svg>
