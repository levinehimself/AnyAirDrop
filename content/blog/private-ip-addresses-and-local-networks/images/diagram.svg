<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How a device uses the subnet mask to decide whether a destination is local</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">Local or not? The subnet mask decides</text>

  <!-- Bracket labels -->
  <text x="265" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Network part (24 bits)</text>
  <line x1="150" y1="94" x2="380" y2="94" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <text x="425" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Device part</text>
  <line x1="390" y1="94" x2="460" y2="94" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Row: You -->
  <text x="30" y="136" font-size="16" font-weight="700" fill="#0F172A">You</text>
  <rect x="150" y="110" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="230" y="110" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="310" y="110" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="390" y="110" width="70" height="40" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="185" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">192</text>
  <text x="265" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">168</text>
  <text x="345" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">1</text>
  <text x="425" y="137" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">23</text>
  <text x="490" y="128" font-size="14" fill="#475569">Mask 255.255.255.0 (/24):</text>
  <text x="490" y="146" font-size="14" fill="#475569">first three numbers = network</text>

  <!-- Row: Target A -->
  <text x="30" y="206" font-size="16" font-weight="700" fill="#0F172A">Target A</text>
  <rect x="150" y="180" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="230" y="180" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="310" y="180" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="390" y="180" width="70" height="40" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="185" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">192</text>
  <text x="265" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">168</text>
  <text x="345" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">1</text>
  <text x="425" y="207" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">40</text>
  <text x="490" y="198" font-size="16" font-weight="700" fill="#15803D">Same network part</text>
  <text x="490" y="217" font-size="14" fill="#475569">deliver directly (ARP, no router)</text>

  <!-- Row: Target B -->
  <text x="30" y="276" font-size="16" font-weight="700" fill="#0F172A">Target B</text>
  <rect x="150" y="250" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="230" y="250" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="310" y="250" width="70" height="40" rx="8" fill="#E2E8F0" stroke="#2563EB" stroke-width="2.5"/>
  <rect x="390" y="250" width="70" height="40" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="185" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">203</text>
  <text x="265" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">0</text>
  <text x="345" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">113</text>
  <text x="425" y="277" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">80</text>
  <text x="490" y="268" font-size="16" font-weight="700" fill="#2563EB">Different network part</text>
  <text x="490" y="287" font-size="14" fill="#475569">send to the router, 192.168.1.1</text>

  <text x="30" y="338" font-size="14" fill="#475569">If the network parts match, the device delivers the data itself on the local network.</text>
  <text x="30" y="360" font-size="14" fill="#475569">If not, it hands the packet to the router and lets it find the way.</text>
</svg>
