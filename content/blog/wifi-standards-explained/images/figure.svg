<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>A slow Wi-Fi link keeps the air busy longer</title>
  <defs>
    <symbol id="i-timer" viewBox="0 0 48 48"><circle cx="24" cy="27" r="15" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M19 5h10M24 27v-9M37 13l3 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">HOW WI-FI WORKS · BY THE NUMBERS</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">A slow link keeps the air busy longer</text>

  <!-- Top card: airtime for one packet -->
  <rect x="32" y="108" width="736" height="144" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="52" y="134" font-size="15" font-weight="700" fill="#0F172A">Time on the air for one 1,500-byte packet (12,000 bits)</text>

  <g font-size="15" font-weight="700" fill="#0F172A">
    <text x="52" y="161">1 Mbps</text>
    <text x="52" y="186">11 Mbps</text>
    <text x="52" y="211">54 Mbps</text>
    <text x="52" y="236">600 Mbps</text>
  </g>
  <g fill="#2563EB">
    <rect x="140" y="148" width="380" height="14" rx="4"/>
    <rect x="140" y="173" width="34.5" height="14" rx="4"/>
    <rect x="140" y="198" width="7" height="14" rx="2"/>
    <rect x="140" y="223" width="1.5" height="14" rx="0.75"/>
  </g>
  <g font-size="15" font-weight="700" fill="#0F172A">
    <text x="530" y="161">12 ms</text>
    <text x="185" y="186">about 1.09 ms</text>
    <text x="157" y="211">about 0.22 ms</text>
    <text x="152" y="236">about 0.02 ms</text>
  </g>
  <text x="572" y="236" font-size="13" text-anchor="end" fill="#475569">Bars drawn to scale</text>

  <line x1="592" y1="124" x2="592" y2="236" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="612" y="166" font-size="24" font-weight="700" fill="#2563EB">600 times</text>
  <text x="612" y="190" font-size="14" fill="#475569">longer at 1 Mbps</text>
  <text x="612" y="209" font-size="14" fill="#475569">than at 600 Mbps</text>

  <!-- Bottom card: taking turns -->
  <rect x="32" y="268" width="736" height="116" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="52" y="294" font-size="15" font-weight="700" fill="#0F172A">Taking turns, one packet each</text>
  <rect x="52" y="306" width="293" height="26" rx="6" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
  <rect x="349" y="306" width="27" height="26" rx="6" fill="#2563EB"/>
  <line x1="362.5" y1="334" x2="362.5" y2="342" stroke="#475569" stroke-width="1.5"/>
  <text x="52" y="360" font-size="14" fill="#475569">54 Mbps: 0.22 ms</text>
  <text x="376" y="360" font-size="14" text-anchor="end" fill="#475569">600 Mbps: 0.02 ms</text>

  <line x1="400" y1="282" x2="400" y2="370" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="436" cy="326" r="26" fill="#DBEAFE"/>
  <use href="#i-timer" x="421" y="311" width="30" height="30" color="#2563EB"/>
  <text x="480" y="294" font-size="14" fill="#475569">0.22 + 0.02 = 0.24 ms per pair</text>
  <text x="480" y="327" font-size="28" font-weight="700" fill="#2563EB">About 50 Mbps</text>
  <text x="480" y="348" font-size="14" fill="#475569">for the 600 Mbps device, down from</text>
  <text x="480" y="366" font-size="14" fill="#475569">600 Mbps while the slow one is busy</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Simplified model, not a measurement</text>
</svg>
