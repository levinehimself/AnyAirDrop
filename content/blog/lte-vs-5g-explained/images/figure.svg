<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>Low, mid and high band 5G compared by reach and peak speed</title>
  <defs>
  <symbol id="i-tower" viewBox="0 0 48 48"><path d="M24 15L15 43M24 15l9 28M18.5 31h11M16.5 37h15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24" cy="11" r="3" fill="currentColor"/><path d="M15 7.5a12 12 0 0 0 0 7M33 7.5a12 12 0 0 1 0 7M10.5 4.5a18 18 0 0 0 0 13M37.5 4.5a18 18 0 0 1 0 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 48 48"><path d="M7 35a17 17 0 1 1 34 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><path d="M24 35l8-11" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="35" r="3" fill="currentColor"/><path d="M11 25l3 2M17 17l2 3M24 13v4M31 17l-2 3M37 25l-3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-wall" viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="30" rx="2" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M5 19h38M5 29h38M20 9v10M32 19v10M14 29v10M28 29v10" stroke="currentColor" stroke-width="2.5"/></symbol>
  <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">PHONES AS MODEMS · COMPARED</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Same 5G icon, three very different bands</text>

  <rect x="32" y="110" width="232" height="272" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="72" cy="148" r="24" fill="#DBEAFE"/>
  <use href="#i-tower" x="57" y="133" width="30" height="30" color="#2563EB"/>
  <text x="108" y="145" font-size="18" font-weight="700" fill="#0F172A">Low band</text>
  <text x="108" y="165" font-size="14" fill="#475569">Wide-area coverage</text>
  <rect x="48" y="178" width="200" height="28" rx="14" fill="#EFF6FF"/>
  <text x="148" y="197" font-size="14" font-weight="500" text-anchor="middle" fill="#0F172A">Below 1 GHz</text>
  <text x="48" y="232" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">REACH</text>
  <text x="248" y="232" font-size="14" font-weight="700" text-anchor="end" fill="#2563EB">Far</text>
  <rect x="48" y="242" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="117" y="242" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="186" y="242" width="62" height="10" rx="5" fill="#2563EB"/>
  <text x="48" y="276" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">PEAK SPEED</text>
  <text x="248" y="276" font-size="14" font-weight="700" text-anchor="end" fill="#2563EB">Modest</text>
  <rect x="48" y="286" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="117" y="286" width="62" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="186" y="286" width="62" height="10" rx="5" fill="#E2E8F0"/>
  <line x1="48" y1="306" x2="248" y2="306" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="48" y="329" font-size="14" fill="#475569">Travels far and passes</text>
  <text x="48" y="347" font-size="14" fill="#475569">through walls. Channels</text>
  <text x="48" y="365" font-size="14" fill="#475569">are narrow.</text>

  <rect x="284" y="110" width="232" height="272" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="324" cy="148" r="24" fill="#DBEAFE"/>
  <use href="#i-gauge" x="309" y="133" width="30" height="30" color="#2563EB"/>
  <text x="360" y="145" font-size="18" font-weight="700" fill="#0F172A">Mid band</text>
  <text x="360" y="165" font-size="14" fill="#475569">Reach and capacity</text>
  <rect x="300" y="178" width="200" height="28" rx="14" fill="#EFF6FF"/>
  <text x="400" y="197" font-size="14" font-weight="500" text-anchor="middle" fill="#0F172A">About 1 to 6 GHz</text>
  <text x="300" y="232" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">REACH</text>
  <text x="500" y="232" font-size="14" font-weight="700" text-anchor="end" fill="#2563EB">Medium</text>
  <rect x="300" y="242" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="369" y="242" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="438" y="242" width="62" height="10" rx="5" fill="#E2E8F0"/>
  <text x="300" y="276" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">PEAK SPEED</text>
  <text x="500" y="276" font-size="14" font-weight="700" text-anchor="end" fill="#2563EB">Fast</text>
  <rect x="300" y="286" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="369" y="286" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="438" y="286" width="62" height="10" rx="5" fill="#E2E8F0"/>
  <line x1="300" y1="306" x2="500" y2="306" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="300" y="329" font-size="14" fill="#475569">NR channels up to 100 MHz:</text>
  <text x="300" y="347" font-size="14" fill="#475569">the main source of fast 5G</text>
  <text x="300" y="365" font-size="14" fill="#475569">in many countries.</text>

  <rect x="536" y="110" width="232" height="272" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="576" cy="148" r="24" fill="#DBEAFE"/>
  <use href="#i-wall" x="561" y="133" width="30" height="30" color="#2563EB"/>
  <text x="612" y="145" font-size="18" font-weight="700" fill="#0F172A">High band</text>
  <text x="612" y="165" font-size="14" fill="#475569">Millimeter wave</text>
  <rect x="552" y="178" width="200" height="28" rx="14" fill="#EFF6FF"/>
  <text x="652" y="197" font-size="14" font-weight="500" text-anchor="middle" fill="#0F172A">Roughly 24 GHz and above</text>
  <text x="552" y="232" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">REACH</text>
  <text x="752" y="232" font-size="14" font-weight="700" text-anchor="end" fill="#2563EB">Short</text>
  <rect x="552" y="242" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="621" y="242" width="62" height="10" rx="5" fill="#E2E8F0"/>
  <rect x="690" y="242" width="62" height="10" rx="5" fill="#E2E8F0"/>
  <text x="552" y="276" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">PEAK SPEED</text>
  <text x="752" y="276" font-size="14" font-weight="700" text-anchor="end" fill="#2563EB">Very high</text>
  <rect x="552" y="286" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="621" y="286" width="62" height="10" rx="5" fill="#2563EB"/>
  <rect x="690" y="286" width="62" height="10" rx="5" fill="#2563EB"/>
  <line x1="552" y1="306" x2="752" y2="306" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="552" y="329" font-size="14" fill="#475569">Easily blocked by walls,</text>
  <text x="552" y="347" font-size="14" fill="#475569">foliage, windows and even</text>
  <text x="552" y="365" font-size="14" fill="#475569">a hand.</text>
  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Rules of thumb, not measurements</text>
</svg>
