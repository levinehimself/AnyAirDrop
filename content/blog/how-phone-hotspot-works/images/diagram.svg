<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>A phone hotspot: the phone works as a router between Wi-Fi and the cellular network</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">A hotspot: the phone is the router</text>

  <!-- Laptop -->
  <rect x="30" y="150" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <rect x="38" y="158" width="84" height="48" rx="3" fill="#E2E8F0"/>
  <line x1="22" y1="226" x2="138" y2="226" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <text x="80" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Laptop</text>
  <text x="80" y="276" text-anchor="middle" font-size="13" fill="#475569">private address</text>

  <!-- Wi-Fi waves -->
  <g fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round">
    <path d="M152 178 Q164 195 152 212"/>
    <path d="M168 166 Q188 195 168 224"/>
    <path d="M184 154 Q212 195 184 236"/>
  </g>
  <text x="170" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">Wi-Fi</text>

  <!-- Phone -->
  <rect x="205" y="90" width="370" height="230" rx="18" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
  <text x="390" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Phone acting as a router</text>

  <rect x="220" y="140" width="100" height="110" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="270" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Wi-Fi chip</text>
  <text x="270" y="196" text-anchor="middle" font-size="13" fill="#475569">runs as an</text>
  <text x="270" y="214" text-anchor="middle" font-size="13" fill="#475569">access point</text>

  <line x1="320" y1="195" x2="340" y2="195" stroke="#0F172A" stroke-width="3"/>

  <rect x="340" y="140" width="100" height="110" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <text x="390" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">Router</text>
  <text x="390" y="196" text-anchor="middle" font-size="13" fill="#475569">DHCP, DNS</text>
  <text x="390" y="214" text-anchor="middle" font-size="13" fill="#475569">and NAT</text>

  <line x1="440" y1="195" x2="460" y2="195" stroke="#0F172A" stroke-width="3"/>

  <rect x="460" y="140" width="100" height="110" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="510" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Cellular</text>
  <text x="510" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">modem</text>
  <text x="510" y="214" text-anchor="middle" font-size="13" fill="#475569">baseband</text>

  <text x="390" y="290" text-anchor="middle" font-size="14" fill="#475569">One cellular link shared by every device</text>

  <!-- Cell waves -->
  <g fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round">
    <path d="M590 178 Q602 195 590 212"/>
    <path d="M606 166 Q626 195 606 224"/>
    <path d="M622 154 Q650 195 622 236"/>
  </g>

  <!-- Tower -->
  <line x1="705" y1="130" x2="682" y2="250" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <line x1="705" y1="130" x2="728" y2="250" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <line x1="693" y1="190" x2="717" y2="190" stroke="#0F172A" stroke-width="3"/>
  <line x1="687" y1="222" x2="723" y2="222" stroke="#0F172A" stroke-width="3"/>
  <circle cx="705" cy="122" r="7" fill="#2563EB"/>
  <text x="705" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Cell tower</text>
  <text x="705" y="302" text-anchor="middle" font-size="13" fill="#475569">then the internet</text>

  <text x="30" y="372" font-size="14" fill="#475569">NAT swaps the laptop's private address for the phone's cellular address.</text>
</svg>
