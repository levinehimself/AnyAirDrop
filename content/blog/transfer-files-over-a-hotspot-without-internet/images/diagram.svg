<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Offline hotspot: files between two devices stay inside the access point</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">Offline hotspot: files stay inside the access point</text>

  <!-- Hotspot phone -->
  <rect x="250" y="66" width="300" height="270" rx="18" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
  <text x="400" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Hotspot phone</text>

  <rect x="275" y="106" width="250" height="88" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <text x="400" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">Access point + DHCP</text>
  <text x="400" y="164" text-anchor="middle" font-size="13" fill="#475569">forwards frames between clients</text>

  <line x1="300" y1="196" x2="300" y2="248" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="322" y="226" font-size="13" fill="#475569">NAT only on the internet path</text>

  <rect x="275" y="250" width="250" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="400" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Cellular modem</text>
  <text x="400" y="297" text-anchor="middle" font-size="13" fill="#475569">no data, not used</text>

  <!-- Laptop -->
  <rect x="30" y="120" width="100" height="64" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <rect x="38" y="128" width="84" height="48" rx="3" fill="#E2E8F0"/>
  <line x1="22" y1="196" x2="138" y2="196" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
  <text x="80" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Laptop</text>
  <text x="80" y="248" text-anchor="middle" font-size="13" fill="#475569">private address</text>

  <!-- Phone B -->
  <rect x="670" y="99" width="80" height="100" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <rect x="682" y="111" width="56" height="60" rx="4" fill="#E2E8F0"/>
  <circle cx="710" cy="186" r="4" fill="none" stroke="#0F172A" stroke-width="2"/>
  <text x="710" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Phone B</text>
  <text x="710" y="248" text-anchor="middle" font-size="13" fill="#475569">private address</text>

  <!-- Wi-Fi links -->
  <text x="198" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Wi-Fi</text>
  <line x1="146" y1="150" x2="268" y2="150" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M154 144 L146 150 L154 156 M260 144 L268 150 L260 156" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="602" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Wi-Fi</text>
  <line x1="532" y1="150" x2="664" y2="150" stroke="#2563EB" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M540 144 L532 150 L540 156 M656 144 L664 150 L656 156" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="30" y="372" font-size="14" fill="#475569">Client-to-client frames never reach the modem, so no mobile data is needed.</text>
</svg>
