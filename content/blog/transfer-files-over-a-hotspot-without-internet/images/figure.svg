<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>What works on a phone hotspot with no internet, and what can still stop a transfer</title>
  <defs>
    <symbol id="i-phone" viewBox="0 0 48 48"><rect x="14" y="4" width="20" height="40" rx="5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M21 9h6M21 39h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 48 48"><path d="M5 19a28 28 0 0 1 38 0M11 26.5a19 19 0 0 1 26 0M17.5 33.5a10 10 0 0 1 13 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="24" cy="40" r="2.8" fill="currentColor"/></symbol>
    <symbol id="i-bluetooth" viewBox="0 0 48 48"><path d="M13 16l21 17-10 9V6l10 9-21 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-folder" viewBox="0 0 48 48"><path d="M5 12a3 3 0 0 1 3-3h11l4 5h17a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-warning" viewBox="0 0 48 48"><path d="M24 6L44 40H4z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 18v11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="34.5" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-globe" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M6 24h36M24 6c-9 9-9 27 0 36M24 6c9 9 9 27 0 36" stroke="currentColor" stroke-width="2.5" fill="none"/></symbol>
    <symbol id="i-check" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M15 25l7 7 12-14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-cross" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M17 17l14 14M31 17L17 31" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-arrows" viewBox="0 0 48 48"><path d="M6 17h34M32 9l8 8-8 8M42 31H8M16 23l-8 8 8 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="70"/><circle cx="790" cy="-10" r="130"/><circle cx="790" cy="-10" r="190"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">PHONES AS MODEMS · CHEAT SHEET</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">What works on a hotspot with no internet</text>

  <!-- left: works offline -->
  <rect x="32" y="108" width="432" height="276" rx="16" fill="#FFFFFF"/>
  <path d="M32 142V124a16 16 0 0 1 16-16H448a16 16 0 0 1 16 16V142Z" fill="#DCFCE7"/>
  <rect x="32" y="108" width="432" height="276" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="32" y1="142" x2="464" y2="142" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-check" x="48" y="114" width="22" height="22" color="#15803D"/>
  <text x="78" y="131" font-size="17" font-weight="700" fill="#15803D">Works with no internet</text>
  <circle cx="62" cy="166" r="14" fill="#DBEAFE"/>
  <use href="#i-globe" x="53" y="157" width="18" height="18" color="#2563EB"/>
  <text x="88" y="163" font-size="15" font-weight="700" fill="#0F172A">A web server on the sending device</text>
  <text x="88" y="178" font-size="13" fill="#475569">The other device opens its address in a browser</text>
  <circle cx="62" cy="205" r="14" fill="#DBEAFE"/>
  <use href="#i-folder" x="53" y="196" width="18" height="18" color="#2563EB"/>
  <text x="88" y="202" font-size="15" font-weight="700" fill="#0F172A">An SMB or FTP server on the phone</text>
  <text x="88" y="217" font-size="13" fill="#475569">A file-server app; good for many files</text>
  <circle cx="62" cy="244" r="14" fill="#DBEAFE"/>
  <use href="#i-arrows" x="53" y="235" width="18" height="18" color="#2563EB"/>
  <text x="88" y="241" font-size="15" font-weight="700" fill="#0F172A">A direct-connection app</text>
  <text x="88" y="256" font-size="13" fill="#475569">Works if the app has a purely local mode</text>
  <circle cx="62" cy="283" r="14" fill="#DBEAFE"/>
  <use href="#i-wifi" x="53" y="274" width="18" height="18" color="#2563EB"/>
  <text x="88" y="280" font-size="15" font-weight="700" fill="#0F172A">Wi-Fi Direct</text>
  <text x="88" y="295" font-size="13" fill="#475569">A direct link with no access point</text>
  <circle cx="62" cy="322" r="14" fill="#DBEAFE"/>
  <use href="#i-phone" x="53" y="313" width="18" height="18" color="#2563EB"/>
  <text x="88" y="319" font-size="15" font-weight="700" fill="#0F172A">AirDrop or Quick Share</text>
  <text x="88" y="334" font-size="13" fill="#475569">Built-in sharing between nearby devices</text>
  <circle cx="62" cy="361" r="14" fill="#DBEAFE"/>
  <use href="#i-bluetooth" x="53" y="352" width="18" height="18" color="#2563EB"/>
  <text x="88" y="358" font-size="15" font-weight="700" fill="#0F172A">Bluetooth</text>
  <text x="88" y="373" font-size="13" fill="#475569">Works anywhere, but slow for large files</text>

  <!-- right: what can stop it -->
  <rect x="480" y="108" width="288" height="276" rx="16" fill="#FFFFFF"/>
  <path d="M480 142V124a16 16 0 0 1 16-16H752a16 16 0 0 1 16 16V142Z" fill="#FEF3C7"/>
  <rect x="480" y="108" width="288" height="276" rx="16" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="480" y1="142" x2="768" y2="142" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-warning" x="496" y="114" width="22" height="22" color="#B45309"/>
  <text x="526" y="131" font-size="17" font-weight="700" fill="#B45309">What can still stop it</text>
  <use href="#i-cross" x="494" y="160" width="20" height="20" color="#B45309"/>
  <text x="524" y="170" font-size="14" font-weight="700" fill="#0F172A">Tools that need an internet</text>
  <text x="524" y="187" font-size="14" font-weight="700" fill="#0F172A">server to introduce devices</text>
  <use href="#i-warning" x="494" y="205" width="20" height="20" color="#B45309"/>
  <text x="524" y="215" font-size="14" fill="#475569">A hotspot that will not start</text>
  <text x="524" y="232" font-size="14" fill="#475569">without cellular service</text>
  <use href="#i-warning" x="494" y="250" width="20" height="20" color="#B45309"/>
  <text x="524" y="260" font-size="14" fill="#475569">Client isolation, so devices</text>
  <text x="524" y="277" font-size="14" fill="#475569">cannot see each other</text>
  <use href="#i-warning" x="494" y="295" width="20" height="20" color="#B45309"/>
  <text x="524" y="305" font-size="14" fill="#475569">A VPN or a firewall that</text>
  <text x="524" y="322" font-size="14" fill="#475569">blocks local connections</text>
  <use href="#i-warning" x="494" y="340" width="20" height="20" color="#B45309"/>
  <text x="524" y="350" font-size="14" fill="#475569">A hotspot that switches off</text>
  <text x="524" y="367" font-size="14" fill="#475569">or drops idle devices</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Each needs a shared network or a direct link</text>
</svg>
