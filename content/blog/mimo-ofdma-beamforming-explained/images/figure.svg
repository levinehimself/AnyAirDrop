<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>Which Wi-Fi feature helps in which situation</title>
  <defs>
    <symbol id="i-file" viewBox="0 0 48 48"><path d="M12 5h17l9 9v29H12z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M29 5v9h9M18 25h14M18 32h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-router" viewBox="0 0 48 48"><path d="M13 29L9 11M35 29l4-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect x="4" y="29" width="40" height="13" rx="3.5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><circle cx="13" cy="35.5" r="1.8" fill="currentColor"/><circle cx="20" cy="35.5" r="1.8" fill="currentColor"/><path d="M31 35.5h9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="i-people" viewBox="0 0 48 48"><circle cx="17" cy="16" r="7" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M4 41c0-8 6-13 13-13s13 5 13 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="34" cy="18" r="5.5" stroke="currentColor" stroke-width="2.5" fill="none"/><path d="M36 28c5 1 8 5 8 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-wall" viewBox="0 0 48 48"><rect x="5" y="9" width="38" height="30" rx="2" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M5 19h38M5 29h38M20 9v10M32 19v10M14 29v10M28 29v10" stroke="currentColor" stroke-width="2.5"/></symbol>
    <symbol id="i-battery" viewBox="0 0 48 48"><rect x="4" y="14" width="36" height="20" rx="4" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M44 21v6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><rect x="9" y="19" width="14" height="10" rx="1.5" fill="currentColor"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">HOW WI-FI WORKS · DECISION GUIDE</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Which feature helps in which situation</text>

  <text x="84" y="121" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">YOUR SITUATION</text>
  <text x="484" y="121" font-size="13" font-weight="700" letter-spacing="1.2" fill="#475569">WHAT HELPS</text>

  <!-- row 1 -->
  <rect x="32" y="132" width="736" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="58" cy="155" r="17" fill="#DBEAFE"/>
  <use href="#i-file" x="47" y="144" width="22" height="22" color="#2563EB"/>
  <text x="84" y="152" font-size="16" font-weight="700" fill="#0F172A">One big file between two devices</text>
  <text x="84" y="169" font-size="13" fill="#475569">Multi-user features add little here</text>
  <path d="M446 155h20M460 149l6 6-6 6" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="484" y="137" width="272" height="36" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="500" y="152" font-size="15" font-weight="700" fill="#0F172A">MIMO and a clean signal</text>
  <text x="500" y="166" font-size="13" fill="#475569">More streams at both ends</text>

  <!-- row 2 -->
  <rect x="32" y="183" width="736" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="58" cy="206" r="17" fill="#DBEAFE"/>
  <use href="#i-router" x="47" y="195" width="22" height="22" color="#2563EB"/>
  <text x="84" y="203" font-size="16" font-weight="700" fill="#0F172A">Far from the router</text>
  <text x="84" y="220" font-size="13" fill="#475569">Gain matters at moderate and long range</text>
  <path d="M446 206h20M460 200l6 6-6 6" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="484" y="188" width="272" height="36" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="500" y="203" font-size="15" font-weight="700" fill="#0F172A">Beamforming</text>
  <text x="500" y="217" font-size="13" fill="#475569">Needs sounding at both ends</text>

  <!-- row 3 -->
  <rect x="32" y="234" width="736" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="58" cy="257" r="17" fill="#DBEAFE"/>
  <use href="#i-people" x="47" y="246" width="22" height="22" color="#2563EB"/>
  <text x="84" y="254" font-size="16" font-weight="700" fill="#0F172A">Many devices sending small packets</text>
  <text x="84" y="271" font-size="13" fill="#475569">Calls, messaging, smart-home chatter</text>
  <path d="M446 257h20M460 251l6 6-6 6" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="484" y="239" width="272" height="36" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="500" y="254" font-size="15" font-weight="700" fill="#0F172A">OFDMA and MU-MIMO</text>
  <text x="500" y="268" font-size="13" fill="#475569">Needs support at both ends</text>

  <!-- row 4 -->
  <rect x="32" y="285" width="736" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="58" cy="308" r="17" fill="#DBEAFE"/>
  <use href="#i-wall" x="47" y="297" width="22" height="22" color="#2563EB"/>
  <text x="84" y="305" font-size="16" font-weight="700" fill="#0F172A">A crowded apartment building</text>
  <text x="84" y="322" font-size="13" fill="#475569">Neighbors' networks on the same channel</text>
  <path d="M446 308h20M460 302l6 6-6 6" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="484" y="290" width="272" height="36" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="500" y="305" font-size="15" font-weight="700" fill="#0F172A">BSS coloring</text>
  <text x="500" y="319" font-size="13" fill="#475569">Wi-Fi 6 on the neighbors' side too</text>

  <!-- row 5 -->
  <rect x="32" y="336" width="736" height="46" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="58" cy="359" r="17" fill="#DBEAFE"/>
  <use href="#i-battery" x="47" y="348" width="22" height="22" color="#2563EB"/>
  <text x="84" y="356" font-size="16" font-weight="700" fill="#0F172A">Battery-powered gadgets and sensors</text>
  <text x="84" y="373" font-size="13" fill="#475569">A plugged-in laptop gains little</text>
  <path d="M446 359h20M460 353l6 6-6 6" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="484" y="341" width="272" height="36" rx="10" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="500" y="356" font-size="15" font-weight="700" fill="#0F172A">Target wake time</text>
  <text x="500" y="370" font-size="13" fill="#475569">Wi-Fi 6 at both ends</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Rules of thumb, not measurements</text>
</svg>
