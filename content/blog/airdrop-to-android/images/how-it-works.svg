<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif"><rect width="1200" height="600" fill="#FFFFFF"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs><text x="60" y="64" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start" >Your files go phone to phone. Our server only introduces them.</text><text x="60" y="100" font-size="18" font-weight="400" fill="#475569" text-anchor="start" >How a transfer works in the browser when both phones share a Wi-Fi network</text><rect x="40" y="250" width="1120" height="250" rx="18" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="64" y="284" font-size="16" font-weight="600" fill="#475569" text-anchor="start" >Your Wi-Fi network</text><rect x="420" y="120" width="360" height="116" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="600.0" y="160" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle" >Connection server</text><text x="600.0" y="190" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" >Matches the two phones</text><text x="600.0" y="214" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" >and passes setup messages</text><rect x="100" y="318" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="240.0" y="358" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle" >iPhone</text><text x="240.0" y="388" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" >Safari</text><text x="240.0" y="412" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" >AnyAirDrop.com</text><rect x="820" y="318" width="280" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="960.0" y="358" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle" >Android phone</text><text x="960.0" y="388" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" >Chrome</text><text x="960.0" y="412" font-size="17" font-weight="400" fill="#475569" text-anchor="middle" >AnyAirDrop.com</text><path d="M240 318 V176 H418" stroke="#475569" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/><path d="M960 318 V176 H782" stroke="#475569" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="254" y="300" font-size="15" font-weight="400" fill="#475569" text-anchor="start" >setup only</text><text x="946" y="300" font-size="15" font-weight="400" fill="#475569" text-anchor="end" >setup only</text><path d="M384 378 H808" stroke="#2563EB" stroke-width="5" fill="none" marker-end="url(#ahb)"/><text x="600" y="360" font-size="18" font-weight="700" fill="#0F172A" text-anchor="middle" >Photos and files, encrypted</text><text x="600" y="406" font-size="16" font-weight="400" fill="#475569" text-anchor="middle" >straight across your Wi-Fi, nothing uploaded</text><text x="60" y="560" font-size="16" font-weight="400" fill="#475569" text-anchor="start" >If a network blocks direct connections (common on guest Wi-Fi), an encrypted relay steps in and the app shows “Relayed”.</text></svg>