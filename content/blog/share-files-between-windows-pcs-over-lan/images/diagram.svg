<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Three ways to move files between two Windows PCs</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Lane 1: shared folder through the router -->
  <line x1="130" y1="82" x2="320" y2="82" stroke="#0F172A" stroke-width="3"/>
  <line x1="480" y1="82" x2="670" y2="82" stroke="#0F172A" stroke-width="3"/>
  <rect x="50" y="64" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="90" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC 1</text>
  <rect x="320" y="64" width="160" height="36" rx="8" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Router</text>
  <rect x="670" y="64" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="710" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC 2</text>
  <text x="400" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">1. Shared folder over the network</text>
  <text x="400" y="148" text-anchor="middle" font-size="14" fill="#475569">Type \\PC2\Share in File Explorer</text>

  <!-- Lane 2: nearby sharing -->
  <line x1="130" y1="190" x2="320" y2="190" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <line x1="480" y1="190" x2="670" y2="190" stroke="#2563EB" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <rect x="50" y="172" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="90" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC 1</text>
  <rect x="320" y="172" width="160" height="36" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <text x="400" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">Bluetooth, Wi-Fi</text>
  <rect x="670" y="172" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="710" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC 2</text>
  <text x="400" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">2. Nearby sharing</text>
  <text x="400" y="256" text-anchor="middle" font-size="14" fill="#475569">Built in; needs Bluetooth LE and a Private network</text>

  <!-- Lane 3: direct cable -->
  <line x1="130" y1="298" x2="670" y2="298" stroke="#0F172A" stroke-width="3"/>
  <rect x="50" y="280" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="90" y="304" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC 1</text>
  <rect x="670" y="280" width="80" height="36" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="710" y="304" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC 2</text>
  <text x="400" y="290" text-anchor="middle" font-size="14" fill="#475569">Ethernet cable</text>
  <text x="400" y="344" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">3. Direct Ethernet cable</text>
  <text x="400" y="364" text-anchor="middle" font-size="14" fill="#475569">No router needed; PCs may self-assign 169.254.x.x addresses</text>
</svg>
