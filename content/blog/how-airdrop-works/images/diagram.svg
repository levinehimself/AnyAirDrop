<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>The five steps of an Apple AirDrop transfer</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F172A"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Devices -->
  <rect x="24" y="64" width="140" height="282" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="94" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Sender</text>
  <text x="94" y="116" text-anchor="middle" font-size="14" fill="#475569">Apple device</text>
  <rect x="636" y="64" width="140" height="282" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="706" y="94" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Receiver</text>
  <text x="706" y="116" text-anchor="middle" font-size="14" fill="#475569">Apple device</text>

  <!-- Step 1: Bluetooth -->
  <text x="400" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">1. Bluetooth LE: short contact hashes</text>
  <line x1="180" y1="160" x2="620" y2="160" stroke="#2563EB" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round" marker-end="url(#ab)"/>

  <!-- Step 2: AWDL -->
  <text x="400" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">2. Wi-Fi link (AWDL) switched on</text>
  <line x1="180" y1="202" x2="620" y2="202" stroke="#0F172A" stroke-width="3" marker-start="url(#ad)" marker-end="url(#ad)"/>

  <!-- Step 3: Discover -->
  <text x="400" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">3. HTTPS /Discover: who are you?</text>
  <line x1="180" y1="244" x2="620" y2="244" stroke="#0F172A" stroke-width="3" marker-start="url(#ad)" marker-end="url(#ad)"/>

  <!-- Step 4: Ask -->
  <text x="400" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">4. HTTPS /Ask: preview shown</text>
  <line x1="180" y1="286" x2="620" y2="286" stroke="#0F172A" stroke-width="3" marker-start="url(#ad)" marker-end="url(#ad)"/>
  <text x="706" y="186" text-anchor="middle" font-size="14" fill="#475569">wakes AWDL on a</text>
  <text x="706" y="204" text-anchor="middle" font-size="14" fill="#475569">hash match or in</text>
  <text x="706" y="222" text-anchor="middle" font-size="14" fill="#475569">Everyone mode</text>
  <text x="94" y="236" text-anchor="middle" font-size="14" fill="#475569">finds the service</text>
  <text x="94" y="254" text-anchor="middle" font-size="14" fill="#475569">using mDNS</text>
  <text x="706" y="296" text-anchor="middle" font-size="16" font-weight="700" fill="#15803D">Tap Accept</text>
  <text x="706" y="316" text-anchor="middle" font-size="13" fill="#475569">(automatic between</text>
  <text x="706" y="333" text-anchor="middle" font-size="13" fill="#475569">your own devices)</text>

  <!-- Step 5: Upload -->
  <text x="400" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">5. HTTPS /Upload: the file</text>
  <line x1="180" y1="328" x2="620" y2="328" stroke="#0F172A" stroke-width="3" marker-end="url(#ad)"/>

  <!-- Caption -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Bluetooth finds, Wi-Fi carries, TLS protects</text>
  <text x="400" y="376" text-anchor="middle" font-size="14" fill="#475569">Steps 2 to 5 use a direct Wi-Fi link, not your router</text>
</svg>
