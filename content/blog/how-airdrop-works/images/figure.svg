<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>A two-byte Bluetooth hash matches a stranger by chance about 0.15 percent of the time and can be guessed in about a second, so a match is only a hint</title>
  <defs>
    <symbol id="i-bluetooth" viewBox="0 0 48 48"><path d="M13 16l21 17-10 9V6l10 9-21 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-shield" viewBox="0 0 48 48"><path d="M24 4l16 6v13c0 10-7 17-16 21C15 40 8 33 8 23V10z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M16.5 24l5 5 10-11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">LOCAL TRANSFER TECH · BY THE NUMBERS</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">A Bluetooth match is a hint, not proof</text>

  <!-- Card 1: the advertisement -->
  <rect x="32" y="108" width="176" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="58" cy="131" r="14" fill="#DBEAFE"/>
  <use href="#i-bluetooth" x="48" y="121" width="20" height="20" color="#2563EB"/>
  <text x="78" y="136" font-size="13" font-weight="700" letter-spacing="0.8" fill="#475569">ADVERTISEMENT</text>
  <rect x="48" y="148" width="144" height="24" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="120" y="165" font-size="14" font-weight="700" text-anchor="middle" fill="#2563EB">Hash 1: 2 bytes</text>
  <rect x="48" y="177" width="144" height="24" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="120" y="194" font-size="14" font-weight="700" text-anchor="middle" fill="#2563EB">Hash 2: 2 bytes</text>
  <rect x="48" y="206" width="144" height="24" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="120" y="223" font-size="14" font-weight="700" text-anchor="middle" fill="#2563EB">Hash 3: 2 bytes</text>
  <rect x="48" y="235" width="144" height="24" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="120" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#2563EB">Hash 4: 2 bytes</text>
  <text x="48" y="278" font-size="14" fill="#475569">Up to four slots;</text>
  <text x="48" y="295" font-size="14" fill="#475569">unused ones hold zeros</text>

  <!-- Card 2: matching by luck -->
  <rect x="224" y="108" width="264" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="244" y="136" font-size="13" font-weight="700" letter-spacing="1" fill="#475569">A STRANGER MATCHES BY LUCK</text>
  <text x="244" y="187" font-size="40" font-weight="700" fill="#2563EB">0.15%</text>
  <text x="244" y="212" font-size="14" fill="#475569">100 contact identifiers</text>
  <text x="244" y="230" font-size="14" fill="#475569">÷ 65,536 values, per hash</text>
  <line x1="244" y1="258" x2="468" y2="258" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="244" y="284" font-size="16" font-weight="700" fill="#0F172A">So a match is only a hint</text>

  <!-- Card 3: trying every value -->
  <rect x="504" y="108" width="264" height="200" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="524" y="136" font-size="13" font-weight="700" letter-spacing="1" fill="#475569">TRYING ALL 65,536 VALUES</text>
  <text x="524" y="187" font-size="14" fill="#475569">about</text>
  <text x="567" y="187" font-size="40" font-weight="700" fill="#2563EB">1 second</text>
  <text x="524" y="212" font-size="14" fill="#475569">A proof of concept woke nearby</text>
  <text x="524" y="230" font-size="14" fill="#475569">phones that held around 100</text>
  <text x="524" y="248" font-size="14" fill="#475569">contact identifiers.</text>
  <line x1="524" y1="258" x2="748" y2="258" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="524" y="284" font-size="16" font-weight="700" fill="#0F172A">Easy to guess</text>

  <!-- Bottom strip -->
  <rect x="32" y="324" width="736" height="60" rx="14" fill="#0F172A"/>
  <circle cx="68" cy="354" r="20" fill="#DBEAFE"/>
  <use href="#i-shield" x="56" y="342" width="24" height="24" color="#2563EB"/>
  <text x="104" y="350" font-size="17" font-weight="700" fill="#FFFFFF">The full hash is checked later</text>
  <text x="104" y="370" font-size="14" fill="#DBEAFE">Over an encrypted connection, before anything is accepted.</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Arithmetic on the guide's example; time from a 2019 paper</text>
</svg>
