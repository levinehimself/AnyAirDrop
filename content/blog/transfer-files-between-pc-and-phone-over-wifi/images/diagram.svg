<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Where a file travels between a phone and a PC</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="400" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Three routes between a phone and a PC</text>

  <!-- Phone and PC -->
  <rect x="50" y="160" width="80" height="100" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="90" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Phone</text>
  <rect x="670" y="160" width="80" height="100" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="710" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">PC</text>

  <!-- Route 1: cloud -->
  <polyline points="90,160 90,100 310,100" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 6" stroke-linejoin="round"/>
  <polyline points="490,100 710,100 710,160" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="6 6" stroke-linejoin="round"/>
  <rect x="310" y="76" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
  <text x="400" y="97" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Cloud storage</text>
  <text x="400" y="115" text-anchor="middle" font-size="14" fill="#475569">upload, then download</text>

  <!-- Route 2: Wi-Fi through the router -->
  <line x1="130" y1="210" x2="310" y2="210" stroke="#2563EB" stroke-width="4"/>
  <line x1="490" y1="210" x2="670" y2="210" stroke="#2563EB" stroke-width="4"/>
  <rect x="310" y="186" width="180" height="48" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <text x="400" y="207" text-anchor="middle" font-size="16" font-weight="700" fill="#2563EB">Router, same Wi-Fi</text>
  <text x="400" y="225" text-anchor="middle" font-size="14" fill="#475569">stays inside your home</text>
  <text x="400" y="258" text-anchor="middle" font-size="14" fill="#475569">browser tools, apps, server apps</text>

  <!-- Route 3: USB -->
  <polyline points="90,260 90,330 710,330 710,260" fill="none" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <text x="400" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">USB cable</text>
  <text x="400" y="354" text-anchor="middle" font-size="14" fill="#475569">direct, no network involved</text>
</svg>
