<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>The six stages between a website and your laptop on a phone hotspot, with the causes of slowdowns that sit in stages 3 to 5</title>
  <defs>
    <symbol id="i-phone" viewBox="0 0 48 48"><rect x="14" y="4" width="20" height="40" rx="5" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M21 9h6M21 39h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 48 48"><rect x="9" y="9" width="30" height="21" rx="3" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M3 37h42l-3.5 4h-35z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-tower" viewBox="0 0 48 48"><path d="M24 15L15 43M24 15l9 28M18.5 31h11M16.5 37h15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24" cy="11" r="3" fill="currentColor"/><path d="M15 7.5a12 12 0 0 0 0 7M33 7.5a12 12 0 0 1 0 7M10.5 4.5a18 18 0 0 0 0 13M37.5 4.5a18 18 0 0 1 0 13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M14 37a9 9 0 0 1-1.5-17.9A11.5 11.5 0 0 1 34.6 17 8.5 8.5 0 0 1 35 37z" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 48 48"><path d="M5 19a28 28 0 0 1 38 0M11 26.5a19 19 0 0 1 26 0M17.5 33.5a10 10 0 0 1 13 0" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/><circle cx="24" cy="40" r="2.8" fill="currentColor"/></symbol>
    <symbol id="i-globe" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-width="2.5"/><path d="M6 24h36M24 6c-9 9-9 27 0 36M24 6c9 9 9 27 0 36" stroke="currentColor" stroke-width="2.5" fill="none"/></symbol>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="0" cy="470" r="80"/><circle cx="0" cy="470" r="140"/><circle cx="0" cy="470" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">PHONES AS MODEMS · WHERE IT HAPPENS</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Almost every slowdown sits in stages 3 to 5</text>

  <!-- one card, six stages -->
  <rect x="32" y="108" width="736" height="276" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="196" width="720" height="138" rx="12" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1.5"/>
  <line x1="88" y1="134" x2="88" y2="357" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M744 126h8v55h-8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="736" y="158.5" font-size="14" text-anchor="end" fill="#475569">Out of your hands</text>

  <!-- stage 1 -->
  <text x="56" y="138.5" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">1</text>
  <circle cx="88" cy="134" r="14" fill="#E2E8F0"/>
  <use href="#i-globe" x="79.0" y="125.0" width="18" height="18" color="#475569"/>
  <text x="120" y="139" font-size="15" font-weight="700" fill="#475569">Website and internet</text>
  <!-- stage 2 -->
  <text x="56" y="177.5" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">2</text>
  <circle cx="88" cy="173" r="14" fill="#E2E8F0"/>
  <use href="#i-cloud" x="79.0" y="164.0" width="18" height="18" color="#475569"/>
  <text x="120" y="178" font-size="15" font-weight="700" fill="#475569">Carrier network</text>
  <!-- stage 3 -->
  <text x="56" y="223.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
  <circle cx="88" cy="219" r="17" fill="#DBEAFE"/>
  <use href="#i-tower" x="76.0" y="207.0" width="24" height="24" color="#2563EB"/>
  <text x="120" y="217" font-size="16" font-weight="700" fill="#0F172A">Cellular link</text>
  <text x="120" y="234" font-size="13" fill="#475569">tower to phone</text>
  <rect x="244" y="206" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="289.0" y="223.5" font-size="13" text-anchor="middle" fill="#0F172A">Weak signal</text>
  <rect x="340" y="206" width="69" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="374.5" y="223.5" font-size="13" text-anchor="middle" fill="#0F172A">Busy cell</text>
  <rect x="415" y="206" width="98" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="464.0" y="223.5" font-size="13" text-anchor="middle" fill="#0F172A">Narrow band</text>
  <rect x="519" y="206" width="76" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="557.0" y="223.5" font-size="13" text-anchor="middle" fill="#0F172A">Plan rules</text>
  <rect x="601" y="206" width="90" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="646.0" y="223.5" font-size="13" text-anchor="middle" fill="#0F172A">Uplink limits</text>
  <!-- stage 4 -->
  <text x="56" y="269.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">4</text>
  <circle cx="88" cy="265" r="17" fill="#DBEAFE"/>
  <use href="#i-phone" x="76.0" y="253.0" width="24" height="24" color="#2563EB"/>
  <text x="120" y="263" font-size="16" font-weight="700" fill="#0F172A">The phone</text>
  <text x="120" y="280" font-size="13" fill="#475569">modem, routing</text>
  <rect x="244" y="252" width="47" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="267.5" y="269.5" font-size="13" text-anchor="middle" fill="#0F172A">Heat</text>
  <rect x="297" y="252" width="95" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="344.5" y="269.5" font-size="13" text-anchor="middle" fill="#0F172A">Battery saver</text>
  <!-- stage 5 -->
  <text x="56" y="315.5" font-size="13" font-weight="700" text-anchor="middle" fill="#2563EB">5</text>
  <circle cx="88" cy="311" r="17" fill="#DBEAFE"/>
  <use href="#i-wifi" x="76.0" y="299.0" width="24" height="24" color="#2563EB"/>
  <text x="120" y="309" font-size="16" font-weight="700" fill="#0F172A">Wi-Fi hop</text>
  <text x="120" y="326" font-size="13" fill="#475569">phone to laptop</text>
  <rect x="244" y="298" width="113" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="300.5" y="315.5" font-size="13" text-anchor="middle" fill="#0F172A">2.4 GHz fallback</text>
  <rect x="363" y="298" width="136" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="431.0" y="315.5" font-size="13" text-anchor="middle" fill="#0F172A">Many active devices</text>
  <rect x="505" y="298" width="131" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="570.5" y="315.5" font-size="13" text-anchor="middle" fill="#0F172A">Distance, obstacles</text>
  <rect x="642" y="298" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
  <text x="690.0" y="315.5" font-size="13" text-anchor="middle" fill="#0F172A">Shared radio</text>
  <!-- stage 6 -->
  <text x="56" y="361.5" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">6</text>
  <circle cx="88" cy="357" r="14" fill="#E2E8F0"/>
  <use href="#i-laptop" x="79.0" y="348.0" width="18" height="18" color="#475569"/>
  <text x="120" y="362" font-size="15" font-weight="700" fill="#475569">The laptop</text>
  <text x="244" y="362" font-size="14" fill="#475569">Updates, syncs and backups can use the whole connection</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Where to look, not a ranking of causes</text>
</svg>
