<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" font-family="Urbanist, system-ui, -apple-system, &apos;Segoe UI&apos;, sans-serif">
  <title>How to read a printer's mDNS reply: four records tell a laptop how to connect</title>
  <defs>
    <symbol id="i-radar" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="3.5" fill="none"/><circle cx="24" cy="24" r="4.6" fill="currentColor"/><path d="M32.87 4.97A21 21 0 0 1 44.92 22.17" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/></symbol>
    <clipPath id="card"><rect x="0.5" y="0.5" width="799" height="449" rx="20"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="449" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g clip-path="url(#card)" fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="790" cy="-10" r="80"/><circle cx="790" cy="-10" r="140"/><circle cx="790" cy="-10" r="200"/>
  </g>
  <text x="32" y="46" font-size="13" font-weight="700" letter-spacing="1.6" fill="#2563EB">LOCAL TRANSFER TECH · CHEAT SHEET</text>
  <text x="32" y="86" font-size="29" font-weight="700" fill="#0F172A">Four records tell a laptop how to connect</text>

  <!-- Left: the reply as it arrives -->
  <rect x="32" y="108" width="400" height="274" rx="16" fill="#0F172A"/>
  <text x="52" y="131" font-size="13" font-weight="700" letter-spacing="1.4" fill="#DBEAFE">THE PRINTER&apos;S REPLY</text>
  <g font-family="ui-monospace, Consolas, &apos;SFMono-Regular&apos;, Menlo, monospace" font-size="14" fill="#FFFFFF">
    <rect x="52" y="152" width="48" height="26" rx="8" fill="#2563EB"/>
    <text x="76" y="169.5" text-anchor="middle" font-size="13" font-weight="700">PTR</text>
    <text x="114" y="170">Office Printer</text>
    <rect x="52" y="216" width="48" height="26" rx="8" fill="#2563EB"/>
    <text x="76" y="233.5" text-anchor="middle" font-size="13" font-weight="700">SRV</text>
    <text x="114" y="234">office-printer.local, port 631</text>
    <rect x="52" y="280" width="48" height="26" rx="8" fill="#2563EB"/>
    <text x="76" y="297.5" text-anchor="middle" font-size="13" font-weight="700">TXT</text>
    <text x="114" y="290">rp=ipp/print</text>
    <text x="114" y="307">ty=Example Model</text>
    <rect x="52" y="344" width="48" height="26" rx="8" fill="#2563EB"/>
    <text x="76" y="361.5" text-anchor="middle" font-size="13" font-weight="700">A</text>
    <text x="114" y="362">192.168.1.42</text>
    <line x1="52" y1="197.0" x2="412" y2="197.0" stroke="#475569" stroke-width="1"/>
    <line x1="52" y1="261.0" x2="412" y2="261.0" stroke="#475569" stroke-width="1"/>
    <line x1="52" y1="325.0" x2="412" y2="325.0" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Connectors -->
  <g fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M440 165h20M454 159l6 6-6 6"/>
    <path d="M440 229h20M454 223l6 6-6 6"/>
    <path d="M440 293h20M454 287l6 6-6 6"/>
    <path d="M440 357h20M454 351l6 6-6 6"/>
  </g>

  <!-- Right: what each record answers -->
  <text x="468" y="125" font-size="13" font-weight="700" letter-spacing="1.4" fill="#475569">WHAT EACH RECORD ANSWERS</text>

  <rect x="468" y="140" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="484" y="160" font-size="16" font-weight="700" fill="#0F172A">Who offers this service?</text>
  <text x="484" y="179" font-size="14" fill="#475569">One instance, called Office Printer</text>

  <rect x="468" y="204" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="484" y="224" font-size="16" font-weight="700" fill="#0F172A">Where do I connect?</text>
  <text x="484" y="243" font-size="14" fill="#475569">That host, port 631 (used for IPP)</text>

  <rect x="468" y="268" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="484" y="288" font-size="16" font-weight="700" fill="#0F172A">Any extra details?</text>
  <text x="484" y="307" font-size="14" fill="#475569">Key=value pairs, such as the model</text>

  <rect x="468" y="332" width="300" height="50" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="484" y="352" font-size="16" font-weight="700" fill="#0F172A">What is its address?</text>
  <text x="484" y="371" font-size="14" fill="#475569">The host&apos;s IPv4 address</text>

  <line x1="32" y1="394" x2="768" y2="394" stroke="#E2E8F0" stroke-width="1.5"/>
  <use href="#i-radar" x="32" y="408" width="24" height="24" color="#2563EB"/>
  <text x="62" y="426" font-size="15" font-weight="700" fill="#0F172A">AnyAirDrop<tspan font-weight="500" fill="#475569">.com</tspan></text>
  <text x="768" y="426" font-size="13" text-anchor="end" fill="#475569">Illustrative reply for a made-up printer</text>
</svg>
