<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Normal Wi-Fi compared with Wi-Fi that has client isolation turned on</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Left panel -->
  <rect x="20" y="30" width="360" height="350" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="200" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Normal Wi-Fi</text>
  <text x="200" y="92" text-anchor="middle" font-size="14" fill="#475569">The AP relays between clients</text>

  <rect x="140" y="112" width="120" height="48" rx="10" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
  <text x="200" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Access point</text>

  <line x1="170" y1="160" x2="75" y2="236" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="160" x2="325" y2="236" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>

  <rect x="45" y="236" width="60" height="70" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <rect x="295" y="236" width="60" height="70" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="75" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone A</text>
  <text x="325" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone B</text>
  <text x="200" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">Phone A reaches Phone B</text>

  <!-- Right panel -->
  <rect x="420" y="30" width="360" height="350" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="600" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Client isolation on</text>
  <text x="600" y="92" text-anchor="middle" font-size="14" fill="#475569">The AP drops client-to-client frames</text>

  <rect x="540" y="112" width="120" height="48" rx="10" fill="#E2E8F0" stroke="#2563EB" stroke-width="3"/>
  <text x="600" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Access point</text>

  <line x1="570" y1="160" x2="475" y2="236" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  <line x1="630" y1="160" x2="725" y2="236" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 8"/>
  <line x1="669" y1="194" x2="685" y2="212" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <line x1="685" y1="194" x2="669" y2="212" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <text x="700" y="198" font-size="14" font-weight="700" fill="#475569">blocked</text>

  <rect x="445" y="236" width="60" height="70" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <rect x="695" y="236" width="60" height="70" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
  <text x="475" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone A</text>
  <text x="725" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Phone B</text>
  <text x="600" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">Phone A cannot reach Phone B</text>
</svg>
