<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" font-family="Urbanist, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Structure of a MAC address and the bit that marks it as randomized</title>
  <rect x="0.5" y="0.5" width="799" height="399" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="30" y="40" font-size="20" font-weight="700" fill="#0F172A">Anatomy of a MAC address</text>

  <!-- Brackets -->
  <text x="244" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">First 3 bytes: OUI (vendor)</text>
  <line x1="92" y1="88" x2="396" y2="88" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <text x="556" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Last 3 bytes: device part</text>
  <line x1="404" y1="88" x2="708" y2="88" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Byte boxes -->
  <rect x="92" y="100" width="96" height="48" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <rect x="196" y="100" width="96" height="48" rx="8" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="300" y="100" width="96" height="48" rx="8" fill="#E2E8F0" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="404" y="100" width="96" height="48" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="508" y="100" width="96" height="48" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="612" y="100" width="96" height="48" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="140" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">a6</text>
  <text x="244" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">3f</text>
  <text x="348" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">19</text>
  <text x="452" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">4c</text>
  <text x="556" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">2e</text>
  <text x="660" y="133" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">7b</text>
  <text x="400" y="176" text-anchor="middle" font-size="14" fill="#475569">Example address a6:3f:19:4c:2e:7b (illustrative)</text>

  <!-- Connector from first byte to bit row -->
  <line x1="140" y1="150" x2="203" y2="232" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="215" y="224" font-size="14" fill="#475569">First byte, a6, written in binary</text>

  <!-- Bits -->
  <rect x="203" y="232" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="253" y="232" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="303" y="232" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="353" y="232" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="403" y="232" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="453" y="232" width="44" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="503" y="232" width="44" height="40" rx="6" fill="#E2E8F0" stroke="#2563EB" stroke-width="3"/>
  <rect x="553" y="232" width="44" height="40" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <text x="225" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">1</text>
  <text x="275" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">0</text>
  <text x="325" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">1</text>
  <text x="375" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">0</text>
  <text x="425" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">0</text>
  <text x="475" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">1</text>
  <text x="525" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#2563EB">1</text>
  <text x="575" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">0</text>

  <!-- Leaders and labels -->
  <line x1="525" y1="274" x2="525" y2="304" stroke="#2563EB" stroke-width="2"/>
  <text x="535" y="322" text-anchor="end" font-size="14" font-weight="700" fill="#2563EB">1 = locally administered</text>
  <text x="535" y="340" text-anchor="end" font-size="14" fill="#475569">(a random or software address)</text>
  <line x1="575" y1="274" x2="575" y2="351" stroke="#475569" stroke-width="2"/>
  <text x="585" y="356" font-size="14" font-weight="700" fill="#475569">0 = unicast (one device)</text>

  <!-- Rule of thumb -->
  <text x="30" y="322" font-size="14" font-weight="700" fill="#0F172A">Rule of thumb</text>
  <text x="30" y="340" font-size="14" fill="#475569">Second hex digit 2, 6, A or E</text>
  <text x="30" y="358" font-size="14" fill="#475569">means a randomized address</text>
</svg>
